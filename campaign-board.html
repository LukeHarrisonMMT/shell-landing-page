<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/shell.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Campaign Assets Board</title>
    </head>
    <body>
        <div class="campaign-board__background">
            <h1 class="size">Screen is too small, view on desktop</h1>
            <div class="campaign-board" id="app">
                <section class="campaign-board__content content">
                    <img class="campaign-board__logo" src="/images/logo.png"/>
                    <div class="campaign-board__ctas">
                        <a href="index.html" class="cta">Home</a>
                        <button class="cta case-study-btn" data-video-id="8Ryf_vtE_BA">Case Study Video</button>
                        <a href="campaign-info.html" class="cta">Extended Campaign Entry Information</a>
                    </div>
                    <h1 class="campaign-board__heading">Campaign Asset Board</h1>
                    <div class="campaign-board__images-left">
                        <picture>
                            <source srcset="/images/board-l.png" />
                            <img class="board-left" />
                        </picture>
                        <h3>Example social posts</h3>
                    </div>
                    <div class="campaign-board__images-right">
                        <picture>
                            <source srcset="/images/board-r.png" />
                            <img class="board-right" />
                        </picture>
                        <h3>The personalisation video</h3>
                    </div>
                </section>
            </div>
        </div>
        <div class="video-modal" id="videoModal" aria-hidden="true">
            <div class="video-modal__overlay"></div>
            <div class="video-modal__content">
                <span aria-hidden="true">&times;</span>
                </button>
                <div class="video-modal__video">
                <iframe 
                    id="videoIframe"
                    src="" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
                </div>
            </div>
        </div>
        <script type="module" src="/src/js/main.js"></script>
    </body>
</html>
